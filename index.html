<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>财税公司智能体平台</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-items: center;
    font: 15px/1.7 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #f4f6f5; color: #1f2937;
  }
  @media (prefers-color-scheme: dark) { body { background: #16181a; color: #e6e8ea; } }
  .box { text-align: center; padding: 28px 22px; max-width: 460px; }
  .mark {
    width: 40px; height: 40px; margin: 0 auto 16px;
    border: 2px solid #9b2c2c; border-radius: 4px; color: #9b2c2c;
    display: grid; place-items: center; font-size: 22px; font-weight: 700;
  }
  h1 { font-size: 19px; font-weight: 600; margin: 0 0 8px; }
  p { margin: 6px 0; color: #6b7280; font-size: 14px; }
  a.go {
    display: inline-block; margin-top: 16px; padding: 10px 22px;
    background: #14456b; color: #fff; text-decoration: none; border-radius: 4px;
  }
  code { font-size: 12.5px; word-break: break-all; color: #6b7280; }
  /* 平台跑在临时隧道上，地址会变，所以要提醒收藏这一页而不是跳转后的地址 */
  .tip { margin-top: 18px; font-size: 13px; color: #9ca3af; line-height: 1.7; }
</style>
</head>
<body>
<div class="box">
  <div class="mark">财</div>
  <h1>财税公司智能体平台</h1>
  <p id="msg">正在跳转到平台，请稍候</p>
  <a class="go" id="go" href="#" hidden>手动打开</a>
  <p class="tip">请收藏本页。跳转后地址栏显示的是临时地址，会定期更换，收藏了过几小时就打不开。</p>
  <p><code id="addr"></code></p>
</div>
<script>
// 平台跑在临时隧道上，隧道地址会变。这一页地址固定，
// 真正的地址存在 target.json 里，隧道一换就更新这个文件，
// 所以外面只要记住这一个网址就行。
//
// 同一个文件从两个地方取。
//
// GitHub Pages 这一份走 CDN，推上去之后要等它自己刷新，实测能卡十几分钟，
// 这段时间里它给的还是上一个地址，人点进去看到的是 Cloudflare 的 1033 错误页。
// raw.githubusercontent 那一份推完就是新的，但国内不一定连得上。
//
// 所以两边一起要，谁先回来先用，两边都回来就用时间戳新的那个。
// 谁也连不上才报错。
var RAW = 'https://raw.githubusercontent.com/Goose666666/cs-entry/main/target.json';
var done = false;

function grab(url) {
  return fetch(url + '?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (d) { return (d && d.url) ? d : null; })
    .catch(function () { return null; });
}

function jump(d) {
  if (done) return;
  done = true;
  var u = d.url.replace(/\/$/, '') + '/web/app/index.html';
  document.getElementById('addr').textContent = d.url;
  var a = document.getElementById('go');
  a.href = u; a.hidden = false;
  // 停两秒再跳，让人看清该收藏的是这一页
  document.getElementById('msg').textContent = '正在跳转到平台';
  setTimeout(function () { location.replace(u); }, 1800);
}

Promise.all([grab('target.json'), grab(RAW)]).then(function (rs) {
  var a = rs[0], b = rs[1];
  var pick = null;
  if (a && b) pick = (String(b.updated || '') > String(a.updated || '')) ? b : a;
  else pick = a || b;
  if (pick) jump(pick);
  else document.getElementById('msg').textContent =
    '平台暂时连不上，可能正在重启，请过一两分钟再刷新这一页。';
});
</script>
</body>
</html>
